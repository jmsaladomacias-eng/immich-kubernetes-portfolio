apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning-v2
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning-v2
  template:
    metadata:
      labels:
        app: immich-machine-learning-v2
    spec:
      containers:
        - name: ml
          image: ghcr.io/immich-app/immich-machine-learning:v3.2.4
          ports:
            - name: http
              containerPort: 3003
          readinessProbe:
            httpGet:
              path: /ping
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning-v2
  namespace: immich
spec:
  type: ClusterIP
  selector:
    app: immich-machine-learning-v2
  ports:
    - port: 3003
      targetPort: 3003
      protocol: TCP
