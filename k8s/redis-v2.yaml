apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis-v2
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis-v2
  template:
    metadata:
      labels:
        app: immich-redis-v2
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis-v2
  namespace: immich
spec:
  type: ClusterIP
  selector:
    app: immich-redis-v2
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
