apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server-v2
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server-v2
  template:
    metadata:
      labels:
        app: immich-server-v2
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.2.4
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: IMMICH_HOST
              value: "0.0.0.0"
            - name: IMMICH_PORT
              value: "3001"

            - name: DB_HOSTNAME
              value: "database-v2"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-v2-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-v2-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-v2-secret
                  key: POSTGRES_DB

            - name: REDIS_HOSTNAME
              value: "redis-v2"
            - name: REDIS_PORT
              value: "6379"

            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning-v2:3003"

            - name: IMMICH_TELEMETRY_INCLUDE
              value: "job"

          volumeMounts:
            - name: immich-data
              mountPath: /usr/src/app/upload

            - name: immich-originals
              mountPath: /mnt/immich-originals
              readOnly: true

            - name: immich-pilot
              mountPath: /mnt/immich-pilot
              readOnly: true

      volumes:
        - name: immich-data
          persistentVolumeClaim:
            claimName: immich-data-v2-pvc

        - name: immich-originals
          hostPath:
            path: /mnt/nfs/immich-originals
            type: Directory

        - name: immich-pilot
          hostPath:
            path: /mnt/immich-ssd/pilot-library
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: immich-web-service-v2
  namespace: immich
spec:
  type: NodePort
  selector:
    app: immich-server-v2
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30082
      protocol: TCP
