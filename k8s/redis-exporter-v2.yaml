apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis-exporter-v2
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis-exporter-v2
  template:
    metadata:
      labels:
        app: immich-redis-exporter-v2
    spec:
      containers:
        - name: redis-exporter
          image: ghcr.io/oliver006/redis_exporter:v1.93.0
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: redis://redis-v2:6379
            - name: REDIS_EXPORTER_CHECK_SINGLE_KEYS
              value: "immich_bull:thumbnailGeneration:wait,immich_bull:thumbnailGeneration:active"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis-exporter-v2
  namespace: immich
spec:
  selector:
    app: immich-redis-exporter-v2
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
