apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-postgres-v2-pv
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: immich-postgres-v2
  volumeMode: Filesystem
  local:
    path: /mnt/immich-ssd/postgres-v2
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-node

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-v2-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: immich-postgres-v2
  resources:
    requests:
      storage: 8Gi
